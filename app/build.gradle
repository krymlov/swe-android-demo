plugins {
    id 'com.android.application'
}

android {
    compileSdk 37
    namespace 'org.swisseph.demo'

    defaultConfig {
        applicationId "org.swisseph.demo"
        minSdk 24
        targetSdk 36
        versionCode 19
        versionName "2.10.03j6f"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        checkDependencies false
        ignoreWarnings true
        quiet true
    }
}

dependencies {
    implementation 'swisseph:swe:2.10.03j6f'
    implementation 'swisseph:swe-jyotisa:2.10.03j6f'
    implementation 'swisseph:swe-android:2.10.03j6f'

    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'commons-io:commons-io:2.22.0'

    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.test:rules:1.7.0'

    testImplementation 'junit:junit:'
    testImplementation fileTree(dir: 'ephe', include: ['*.*'])

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}